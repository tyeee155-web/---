<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>💌 For You</title>

<style>
  body {
    background: linear-gradient(#ffd6e7, #ffc0cb);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
    margin: 0;
  }

  .container {
    text-align: center;
  }

  /* 👇 ข้อความ */
  .text {
    color: white;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 10px #ff4d88;
    margin-bottom: 20px;
    position: relative;
    z-index: 20;
  }

  /* 💌 ซอง */
  .envelope {
    width: 220px;
    height: 140px;
    background: #ff4d88;
    position: relative;
    margin: auto;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    z-index: 10;
  }

  /* ฝาซอง */
  .flap {
    width: 0;
    height: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-bottom: 70px solid #ff4d88;
    position: absolute;
    top: -70px;
    transform-origin: bottom;
    transition: 0.6s;
  }

  /* กระดาษ */
  .letter {
    width: 200px;
    height: 120px;
    background: white;
    position: absolute;
    top: 10px;
    left: 10px;
    border-radius: 10px;
    padding: 10px;
    box-sizing: border-box;
    transform: translateY(0);
    transition: 0.6s;
    opacity: 0;
  }

  .open .flap {
    transform: rotateX(180deg);
  }

  .open .letter {
    transform: translateY(-140px);
    opacity: 1;
  }
</style>
</head>

<body>

<div class="container">
  <div class="text">💌 มีบางอย่างอยากบอก...</div>

  <div class="envelope" id="env" onclick="openLetter()">
    <div class="flap"></div>
    <div class="letter">
      <h3 style="color:#ff4d88;">เปิดดูสิ 🥰</h3>
    </div>
  </div>
</div>

<script>
function openLetter() {
  let env = document.getElementById("env");
  env.classList.add("open");

  setTimeout(() => {
    window.location.href = "love.html";
  }, 1200);
}
</script>

</body>
</html>
